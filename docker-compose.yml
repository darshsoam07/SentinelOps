services:
  ops-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: sentinelops
      POSTGRES_DB: sentinelops
      POSTGRES_PASSWORD: "${OPS_DB_PASSWORD:?set database password}"
    volumes: [ops-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "sentinelops"]
      interval: 5s
      timeout: 3s
      retries: 10
  ops-api:
    build:
      context: .
      dockerfile: infrastructure/docker/python-service.Dockerfile
      args: { SERVICE_PATH: backend/api }
    environment:
      PROMETHEUS_URL: http://prometheus:9090
      ALERT_TOKEN_FILE: /run/secrets/alert_token
      SENTINELOPS_DATABASE_URL: "postgresql+psycopg://sentinelops:${OPS_DB_PASSWORD:?set database password}@ops-db/sentinelops"
      DASHBOARD_ORIGINS: http://localhost:8080
      SENTINELOPS_OPERATOR: "${SENTINELOPS_OPERATOR:-operator}"
      SENTINELOPS_JWT_SECRET: "${SENTINELOPS_JWT_SECRET:?configure authentication}"
      SENTINELOPS_PASSWORD_HASH: "${SENTINELOPS_PASSWORD_HASH:?configure authentication}"
    command: ["sh", "-ec", "alembic upgrade head && exec uvicorn app.main:app --host 0.0.0.0 --port 8000"]
    secrets: [alert_token]
    depends_on: { ops-db: { condition: service_healthy } }
    ports: ["127.0.0.1:${OPS_PORT:-8000}:8000"]
  pay-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: payflow
      POSTGRES_DB: payflow
      POSTGRES_PASSWORD: "${PAY_DB_PASSWORD:?set database password}"
    volumes: [pay-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "payflow"]
      interval: 5s
      timeout: 3s
      retries: 10
  pay-api:
    build:
      context: .
      dockerfile: infrastructure/docker/python-service.Dockerfile
      args: { SERVICE_PATH: applications/payflow/payment-service }
    environment:
      PAYFLOW_DATABASE_URL: "postgresql+psycopg://payflow:${PAY_DB_PASSWORD:?set database password}@pay-db/payflow"
      DASHBOARD_ORIGINS: http://localhost:8080
      SENTINELOPS_OPERATOR: "${SENTINELOPS_OPERATOR:-operator}"
      SENTINELOPS_JWT_SECRET: "${SENTINELOPS_JWT_SECRET:?configure authentication}"
    command: ["sh", "-ec", "alembic upgrade head && exec uvicorn app.main:app --host 0.0.0.0 --port 8000"]
    depends_on: { pay-db: { condition: service_healthy } }
    ports: ["127.0.0.1:${PAY_PORT:-8001}:8000"]
  dashboard:
    build:
      context: .
      dockerfile: infrastructure/docker/dashboard.Dockerfile
      args:
        VITE_SENTINELOPS_API_URL: http://localhost:8000
        VITE_PAYFLOW_API_URL: http://localhost:8001
    ports: ["127.0.0.1:${DASHBOARD_PORT:-8080}:8080"]
  prometheus:
    image: prom/prometheus:v3.5.0
    ports: ["127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"]
    volumes:
      - ./infrastructure/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infrastructure/monitoring/payflow.yml:/etc/prometheus/payflow.yml:ro
  alertmanager:
    image: prom/alertmanager:v0.28.1
    secrets: [alert_token]
    ports: ["127.0.0.1:${ALERTMANAGER_PORT:-9093}:9093"]
    volumes:
      - ./infrastructure/monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
  grafana:
    image: grafana/grafana:12.1.1
    environment:
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_PASSWORD:?set Grafana password}"
    ports: ["127.0.0.1:${GRAFANA_PORT:-3000}:3000"]
    volumes:
      - ./infrastructure/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infrastructure/monitoring/grafana/dashboards:/etc/grafana/sentinel:ro
secrets:
  alert_token:
    environment: ALERT_WEBHOOK_TOKEN

volumes:
  ops-data: {}
  pay-data: {}
