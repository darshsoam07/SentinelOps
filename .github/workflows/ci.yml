name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [backend/api, applications/payflow/payment-service]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            **/requirements*.txt
            **/constraints.txt
      - run: pip install ./shared -r "$SERVICE/requirements-dev.txt"
        env:
          SERVICE: ${{ matrix.service }}
      - run: python -m coverage run --source=app -m pytest -q && python -m coverage report -m
        working-directory: ${{ matrix.service }}
  persistence:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: disposable_ci
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ./shared -r backend/api/requirements-dev.txt -r applications/payflow/payment-service/requirements-dev.txt
      - run: python scripts/test-persistence.py
        env:
          SENTINELOPS_DATABASE_URL: postgresql+psycopg://postgres:disposable_ci@localhost/postgres
          PAYFLOW_DATABASE_URL: postgresql+psycopg://postgres:disposable_ci@localhost/postgres
  dashboard:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
  images:
    needs: [backend, persistence, dashboard]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [ops-api, pay-api, dashboard]
    steps:
      - uses: actions/checkout@v4
      - run: docker compose -p sentinel build "$SERVICE"
        env:
          SERVICE: ${{ matrix.service }}
          GRAFANA_PASSWORD: build_only
          RECOVERY_TOKEN: build_only
          ALERT_WEBHOOK_TOKEN: build_only
          OPS_DB_PASSWORD: build_only
          PAY_DB_PASSWORD: build_only
          SENTINELOPS_PASSWORD_HASH: build_only
      - run: docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.76.2 image --exit-code 1 --severity HIGH,CRITICAL --ignore-unfixed "sentinel-$SERVICE"
        env:
          SERVICE: ${{ matrix.service }}
  playwright:
    needs: [backend, persistence, dashboard]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: python -m venv .venv && .venv/bin/pip install ./shared -r backend/api/requirements.txt -r applications/payflow/payment-service/requirements.txt
      - run: npm ci && npx playwright install --with-deps chromium && npm run test:e2e
        working-directory: dashboard
  compose-recovery:
    needs: [backend, dashboard, persistence]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: python -m venv .venv && .venv/bin/pip install ./shared -r backend/api/requirements.txt
      - name: Provision disposable credentials
        run: |
          .venv/bin/python scripts/generate-keys.py
          .venv/bin/python - <<'PY'
          from pathlib import Path
          from secrets import token_hex
          from pwdlib import PasswordHash
          import os
          password = token_hex(24)
          Path(".env").write_text("\n".join(f"{key}={token_hex(32)}" for key in
              ["OPS_DB_PASSWORD","PAY_DB_PASSWORD","RECOVERY_TOKEN","ALERT_WEBHOOK_TOKEN","GRAFANA_PASSWORD"])
              + "\nSENTINELOPS_PASSWORD_HASH='" + PasswordHash.recommended().hash(password) + "'\n")
          with open(os.environ["GITHUB_ENV"],"a") as env:
              env.write("SNT_BROWSER_PASSWORD=" + password + "\n")
          PY
      - run: docker compose up --build -d
      - run: npm ci && npx playwright install --with-deps chromium && npx playwright test --config playwright.compose.config.ts
        working-directory: dashboard
